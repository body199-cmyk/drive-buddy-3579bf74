name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python package (tests + Colab contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest

      - name: Byte-compile the package
        run: python -m compileall teledrive

      - name: Run test suite
        run: python -m pytest -q tests

      - name: Verify launcher binding check needs no credentials
        run: python teledrive_launcher.py --check

      - name: Verify both notebooks match the single generator
        run: python -m teledrive.notebook_cells --check

      - name: Verify the notebooks are identical
        run: cmp notebook/TeleDrive.ipynb ../public/TeleDrive.ipynb

      - name: Build the distributable archive
        run: python -m teledrive.package_service --build --output teledrive_v3.1.zip

      - uses: actions/upload-artifact@v4
        with:
          name: teledrive-package
          path: python-package/teledrive_v3.1.zip
          if-no-files-found: error

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

