name: Format React UX branch
on:
  push:
    branches: [feat/react-responsive-ux-redesign]
    paths:
      - .github/workflows/format-react-ux.yml
  pull_request:
    paths:
      - .github/workflows/format-react-ux.yml
permissions:
  contents: write
jobs:
  autoformat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/react-responsive-ux-redesign
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format React UX files
        run: bunx prettier --write src/components/teleDrive/TeleDriveSandbox.tsx src/components/teleDrive/UniversalSection.tsx src/components/teleDrive/bridgeTypes.ts src/components/teleDrive/remoteColabBridge.ts
      - name: Commit formatted files on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/teleDrive/TeleDriveSandbox.tsx src/components/teleDrive/UniversalSection.tsx src/components/teleDrive/bridgeTypes.ts src/components/teleDrive/remoteColabBridge.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): format responsive React UX source"
            git push origin HEAD:feat/react-responsive-ux-redesign
          fi
