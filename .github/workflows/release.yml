name: Release TeleDrive package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Unique release suffix, e.g. 2026.10.21-m16t01 (do not include pkg-)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: teledrive-package-release
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build, and publish a verified package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: pkg-${{ inputs.version }}
      BUILD_RUN_ID: ${{ github.run_id }}
      SOURCE_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: python-package

    steps:
      - name: Validate release version and ensure tag is new
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^pkg-[A-Za-z0-9._-]{5,75}$ ]]; then
            echo "Invalid version. Use letters, numbers, dots, underscores or hyphens."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; choose a new version."
            exit 1
          fi

      - name: Checkout selected source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-package/requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pytest

      - name: Compile package
        run: python -m compileall -q teledrive

      - name: Run test suite
        run: python -m pytest -q tests

      - name: Build tested archive
        run: python -m teledrive.package_service --build --output teledrive_v4.5.zip

      - name: Verify archive layout and calculate integrity metadata
        id: archive
        shell: bash
        run: |
          unzip -t teledrive_v4.5.zip
          unzip -l teledrive_v4.5.zip | grep -Eq 'teledrive-v4\.5/requirements\.lock'
          echo "sha256=$(sha256sum teledrive_v4.5.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s teledrive_v4.5.zip)" >> "$GITHUB_OUTPUT"

      - name: Create integrity manifest
        env:
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
          ARCHIVE_SIZE: ${{ steps.archive.outputs.size }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          manifest = {
              "schema": 1,
              "release": tag,
              "commit": os.environ["SOURCE_SHA"],
              "product_version": "4.5.0",
              "sha256": os.environ["ARCHIVE_SHA256"],
              "size_bytes": int(os.environ["ARCHIVE_SIZE"]),
              "archive_url": (
                  "https://github.com/body199-cmyk/drive-buddy-3579bf74"
                  f"/releases/download/{tag}/teledrive_v4.5.zip"
              ),
              "build_run_id": int(os.environ["BUILD_RUN_ID"]),
          }
          Path("teledrive_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish release and assets
        env:
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
          ARCHIVE_SIZE: ${{ steps.archive.outputs.size }}
        run: |
          gh release create "$RELEASE_TAG" \
            teledrive_v4.5.zip teledrive_manifest.json \
            --target "$SOURCE_SHA" \
            --title "TeleDrive package $RELEASE_TAG" \
            --notes "Tested package built from commit $SOURCE_SHA.\n\nArchive SHA-256: $ARCHIVE_SHA256\nArchive size: $ARCHIVE_SIZE bytes\nBuild run: $BUILD_RUN_ID"

      - name: Verify published release metadata
        run: |
          gh release view "$RELEASE_TAG" --json tagName,targetCommitish,assets
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx 'teledrive_v4.5.zip'
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx 'teledrive_manifest.json'
