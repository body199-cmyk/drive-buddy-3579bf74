name: Publish current TeleDrive package

# M46-T02 distribution fix:
# Notebook Cell 1 is pinned to the STABLE tag below. Publishing each run
# under a fresh `pkg-<run_id>` tag (106d8f8) left that pinned endpoint
# serving an old package forever (no web_dashboard.py), while a manual
# dispatch requirement stranded every merged fix behind an owner click
# the sandbox itself cannot perform (workflow_dispatch -> HTTP 403).
# So this workflow now also runs automatically on package-changing
# pushes to main and REFRESHES the assets of the one stable tag. The
# full constitution gates below still run first; a failing gate
# publishes nothing. The release/tag are never deleted.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "python-package/**"
      - "public/TeleDrive.ipynb"
      - ".github/workflows/release-current.yml"

permissions:
  contents: write

concurrency:
  group: publish-current-teledrive-package
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish current main package
    runs-on: ubuntu-latest
    env:
      TELEDRIVE_ROOT: ${{ github.workspace }}/teledrive_runtime
      TELEDRIVE_LANG: en
      # STABLE tag: keep in lockstep with PKG_RELEASE_TAG in
      # teledrive/notebook_cells.py (Cell 1). Never a per-run tag.
      RELEASE_TAG: pkg-2026.08.09-m15t07
      PRODUCT_VERSION: 5.0.0
      REPOSITORY: ${{ github.repository }}

    defaults:
      run:
        working-directory: python-package

    steps:
      - name: Checkout the selected current main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and record the exact main SHA
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "CURRENT_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"
          echo "current main SHA: $CURRENT_SHA"

      - name: Verify M15-T11 implementation is present
        run: |
          set -euo pipefail
          test -f teledrive/media_scanner.py
          test -f teledrive/services.py
          test -f teledrive/handlers.py
          test -f teledrive/ui.py
          test -f tests/test_scoped_scan.py
          test -f tests/test_analyze_ui_contract.py
          grep -q "ScanRequest" teledrive/media_scanner.py
          grep -q "test_handler_passes_bounded_scan_request" tests/test_scoped_scan.py
          echo "M15-T11 source and proof tests present"

      - name: Install pinned Python 3.11 (same as CI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest

      - name: Regenerate notebook artifacts before release gates
        run: python -m teledrive.notebook_cells --write

      - name: Run constitution gates
        run: |
          set -euo pipefail
          python -m compileall -q teledrive
          python -m pytest -q tests
          python teledrive_launcher.py --check
          python -m teledrive.notebook_cells --check
          cmp notebook/TeleDrive.ipynb ../public/TeleDrive.ipynb

      - name: Build the tested archive
        run: |
          set -euo pipefail
          python -m teledrive.package_service --build --output teledrive_v4.5.zip

      - name: Verify archive layout
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("teledrive_v4.5.zip").namelist()
          assert "teledrive-v4.5/requirements.lock" in names
          assert "teledrive-v4.5/teledrive/web_dashboard.py" in names
          # Guard against publishing a notebook ZIP that silently omits the
          # Universal Downloader module while the dashboard still renders.
          assert "teledrive-v4.5/teledrive/universal_downloader.py" in names
          assert "teledrive-v4.5/requirements.lock" in names
          assert any(name.startswith("teledrive-v4.5/") for name in names)
          print("archive layout verified")
          PY

      - name: Measure exact archive bytes
        run: |
          set -euo pipefail
          ARCHIVE_SHA256="$(sha256sum teledrive_v4.5.zip | cut -d' ' -f1)"
          ARCHIVE_SIZE="$(stat -c%s teledrive_v4.5.zip)"
          test "${#ARCHIVE_SHA256}" -eq 64
          test "$ARCHIVE_SIZE" -gt 0
          echo "ARCHIVE_SHA256=$ARCHIVE_SHA256" >> "$GITHUB_ENV"
          echo "ARCHIVE_SIZE=$ARCHIVE_SIZE" >> "$GITHUB_ENV"
          echo "archive sha256: $ARCHIVE_SHA256"
          echo "archive size: $ARCHIVE_SIZE"

      - name: Generate manifest from the exact archive bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          manifest = {
              "schema": 1,
              "release": os.environ["RELEASE_TAG"],
              "commit": os.environ["CURRENT_SHA"],
              # M46-T03: monotonically increasing build order. Notebook
              # Cell 1 compares this across the latest-resolved and
              # pinned manifests and installs the newer build, so a
              # stable tag refreshed in place (old creation date) is
              # never shadowed by an older per-run "latest" release.
              "build_run_id": int(os.environ.get("GITHUB_RUN_ID") or 0),
              "product_version": os.environ["PRODUCT_VERSION"],
              "sha256": os.environ["ARCHIVE_SHA256"],
              "size_bytes": int(os.environ["ARCHIVE_SIZE"]),
              "archive_url": (
                  "https://github.com/" + os.environ["REPOSITORY"]
                  + "/releases/download/" + os.environ["RELEASE_TAG"]
                  + "/teledrive_v4.5.zip"
              ),
          }
          with open("teledrive_manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Validate manifest against the exact archive
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          archive = pathlib.Path("teledrive_v4.5.zip").read_bytes()
          manifest = json.loads(pathlib.Path("teledrive_manifest.json").read_text())
          assert manifest["commit"]
          assert len(manifest["sha256"]) == 64
          assert manifest["sha256"] == hashlib.sha256(archive).hexdigest()
          assert manifest["size_bytes"] == len(archive)
          assert manifest["archive_url"].endswith("/teledrive_v4.5.zip")
          print("manifest matches archive bytes")
          PY

      - name: Publish release from the GitHub runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Current main package. Built from commit $CURRENT_SHA by workflow run $GITHUB_RUN_ID. Archive sha256=$ARCHIVE_SHA256 size_bytes=$ARCHIVE_SIZE. This release is a code-complete candidate and is not Colab-ready until owner-run live proof."
          if ! gh release view "$RELEASE_TAG" --json tagName > /tmp/release_view.json 2>/dev/null; then
            echo "release absent -> creating atomically with both assets"
            gh release create "$RELEASE_TAG" \
              --target "$CURRENT_SHA" \
              --title "TeleDrive package $RELEASE_TAG" \
              --notes "$NOTES" \
              teledrive_v4.5.zip \
              teledrive_manifest.json
          else
            # M46-T02 supersedes the M37-T01 no-swap policy FOR THIS
            # WORKFLOW ONLY. Rationale, recorded in
            # PHASE_M46_T02: a "publish current" run that refuses to
            # change any asset strands Notebook Cell 1 on stale code;
            # the owner's own workaround (per-run tags, 106d8f8) made
            # the pinned endpoint stale in the other direction. The
            # release and tag are still NEVER deleted. The zip is
            # replaced FIRST and the manifest LAST, so the manifest
            # stays the commit point: a Cell-1 updater that reads the
            # old manifest against the new zip fails digest checking
            # and safely keeps its current package (fail-closed), and
            # an updater reading after the manifest swap sees a fully
            # consistent pair. The public verification step below then
            # proves the published bytes match this exact commit.
            echo "release exists -> refreshing assets in place (zip first, manifest last)"
            gh release upload "$RELEASE_TAG" teledrive_v4.5.zip --clobber
            gh release upload "$RELEASE_TAG" teledrive_manifest.json --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$CURRENT_SHA" \
              --title "TeleDrive package $RELEASE_TAG" \
              --notes "$NOTES"
            echo "assets refreshed in place; release and tag preserved"
          fi

      - name: Verify public manifest and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.request
          tag = os.environ["RELEASE_TAG"]
          base = "https://github.com/" + os.environ["REPOSITORY"] + "/releases/download/" + tag + "/"

          def fetch(url):
              request = urllib.request.Request(url, headers={"User-Agent": "teledrive-release-verifier"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          manifest = json.loads(fetch(base + "teledrive_manifest.json").decode("utf-8"))
          archive = fetch(base + "teledrive_v4.5.zip")
          assert manifest["commit"] == os.environ["CURRENT_SHA"]
          assert manifest["size_bytes"] == len(archive)
          assert manifest["sha256"] == hashlib.sha256(archive).hexdigest()
          print("PUBLIC VERIFICATION OK")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
